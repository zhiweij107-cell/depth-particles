name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/DepthParticles-*-win-*.exe
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            release/DepthParticles-*-mac-*.dmg
            release/DepthParticles-*-mac-*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print -exec cp {} upload/ \;
          if [ -f USAGE.txt ]; then cp USAGE.txt upload/USAGE.txt; fi
          if [ -f "????.txt" ]; then cp "????.txt" upload/USAGE.txt; fi
          ls -lah upload

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          body: |
            ## Depth Particles ${{ github.ref_name }}

            ### Downloads
            - **Windows**: `DepthParticles-*-win-x64-portable.exe`
            - **macOS Apple Silicon**: `DepthParticles-*-mac-arm64.dmg`
            - **macOS Intel**: `DepthParticles-*-mac-x64.dmg`

            ### macOS tip
            Unsigned app ? right-click Open, or run:
            `xattr -cr "/Applications/????.app"`

            See `USAGE.txt`. First AI depth run needs network (~100MB model).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
