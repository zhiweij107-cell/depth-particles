name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            release/*便携版.exe
            release/*.exe
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print -exec cp {} upload/ \;
          cp 使用说明.txt upload/使用说明.txt
          ls -lah upload

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          body: |
            ## 深度粒子 ${{ github.ref_name }}

            ### 下载
            - **Windows**：`*-win-x64-便携版.exe`（双击运行）
            - **macOS Apple Silicon**：`*-mac-arm64.dmg` / `.zip`
            - **macOS Intel**：`*-mac-x64.dmg` / `.zip`

            ### macOS 提示
            未签名应用，若无法打开：右键 App → 打开，或终端执行  
            `xattr -cr /Applications/深度粒子.app`

            ### 使用
            详见附件 `使用说明.txt`。导入图片自动估深时，首次需联网下载模型。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
